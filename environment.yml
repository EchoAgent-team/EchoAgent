name: echoagent-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24.0          # use Conda's optimized build
  - pip:
      - "sqlalchemy>=2.0.0"
      - "chromadb>=0.4.0"
      - "sentence-transformers>=2.2.0"
      - "Pillow>=10.0.0"
      - "torch>=2.2.0"
      - "transformers>=5.0.0"
      - "huggingface_hub>=1.0.0"
      - "langgraph>=1.0.0"
      - "langchain-chroma>=1.0.0"
      - "groq>=1.0.0"
      - "python-dotenv>=1.0.0"
      - "h5py>=3.10.0"
      - "pandas>=2.0.0"
      - "tqdm>=4.65.0"
      - "fastapi>=0.110.0"
      - "uvicorn>=0.30.0"
      - "pytest>=7.0.0"
